name: Windows verification and package

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify and build application image
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Type app-image
      - name: Record artifact hashes
        shell: pwsh
        run: Get-FileHash target/dist/* -Algorithm SHA256 | Format-Table | Out-File target/dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-java-edition-windows-x64
          path: |
            target/dist/*.zip
            target/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
